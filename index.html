<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1324">
  <title>Créer un compte | JBL</title>
  <style>
    :root {
      --navy: #0b1324; --navy2: #141f38; --gold: #c9a24d; --gold2: #e3c177; --goldtxt: #8f6b1c;
      --ink: #0f172a; --muted: #64748b; --line: #dfe3ea; --field: #f4f6f9; --white: #fff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--navy); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .ic { width: 20px; height: 20px; flex: none; }

    /* Grand espace marque */
    .hero {
      flex: none; min-height: 27vh; display: grid; place-items: center; text-align: center;
      padding: 36px 16px 56px; background: var(--navy);
    }
    .logo { font-size: clamp(60px, 20vw, 108px); font-weight: 900; letter-spacing: .09em; padding-left: .09em; line-height: 1; color: var(--gold2); }
    .bar { display: block; width: 44px; height: 3px; margin: 16px auto 0; background: var(--gold); border-radius: 2px; }
    .copy { display: none; }

    /* Zone formulaire */
    .sheet {
      flex: 1; margin-top: -26px; background: var(--white); border-radius: 26px 26px 0 0;
      padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    }
    .inner { max-width: 420px; margin: 0 auto; }
    h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -.3px; }
    .sub { margin: 6px 0 22px; font-size: 14px; color: var(--muted); }
    .field { margin: 0 0 14px; }
    label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 600; color: #334155; }
    label small { font-weight: 400; color: #8793a6; }
    .ctl {
      display: flex; align-items: center; height: 52px; border: 1.5px solid var(--line); border-radius: 12px;
      background: var(--field); transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .ctl:focus-within { background: #fff; border-color: var(--gold); box-shadow: 0 0 0 4px #c9a24d26; }
    .ctl > .ic { margin-left: 14px; color: var(--navy2); }
    .ctl input {
      flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
      padding: 0 14px 0 12px; font: inherit; font-size: 16px; color: var(--ink);
    }
    .ctl input::placeholder { color: #9aa4b5; }
    .eye { width: 48px; height: 100%; border: 0; background: transparent; color: #7b8698; cursor: pointer; display: grid; place-items: center; border-radius: 0 12px 12px 0; }
    .eye:hover { color: var(--ink); }
    .eye:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
    .dial {
      height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; border: 0;
      border-right: 1.5px solid var(--line); background: transparent; font: inherit; font-size: 16px;
      font-weight: 650; color: var(--ink); cursor: pointer; border-radius: 12px 0 0 12px;
    }
    .dial .ic { width: 20px; height: 20px; color: var(--navy2); }
    .dial .chev { width: 14px; height: 14px; color: #7b8698; }
    .dial:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
    .note { margin: 7px 0 0; font-size: 12.5px; color: #2f7d4f; display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .note .ic { width: 15px; height: 15px; }
    .submit {
      width: 100%; height: 54px; margin-top: 8px; border: 0; border-radius: 12px; background: var(--gold);
      color: var(--navy); font: inherit; font-size: 16px; font-weight: 750; cursor: pointer; transition: background .15s, transform .1s;
    }
    .submit:hover { background: var(--gold2); }
    .submit:active { transform: scale(.99); }
    .submit:focus-visible { outline: 3px solid #c9a24d66; outline-offset: 2px; }
    .submit:disabled { opacity: .65; cursor: wait; }
    .foot { margin: 20px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
    .foot a { color: var(--goldtxt); font-weight: 700; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    /* Sélection du pays (panneau du bas) */
    .picker { position: fixed; inset: 0; z-index: 20; visibility: hidden; transition: visibility 0s .3s; }
    .picker.open { visibility: visible; transition-delay: 0s; }
    .backdrop { position: absolute; inset: 0; background: #060a14b3; opacity: 0; transition: opacity .3s; }
    .picker.open .backdrop { opacity: 1; }
    .pane {
      position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: #fff;
      border-radius: 26px 26px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform .3s ease;
    }
    .picker.open .pane { transform: none; }
    .grab { width: 44px; height: 5px; border-radius: 3px; background: #d4d9e2; margin: 0 auto 10px; }
    .pane-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .back { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
    .back:hover { background: var(--field); }
    .pane-head h2 { flex: 1; margin: 0 40px 0 0; text-align: center; font-size: 17px; font-weight: 700; }
    .list { display: grid; gap: 10px; }
    .opt {
      display: flex; align-items: center; gap: 16px; width: 100%; padding: 16px; border: 1.5px solid var(--line);
      border-radius: 12px; background: var(--field); font: inherit; font-size: 16px; cursor: pointer; text-align: left; color: var(--ink);
    }
    .opt:hover { background: #fff; border-color: #c5ccd8; }
    .opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .opt .d { width: 52px; font-weight: 750; color: var(--goldtxt); }
    .opt .n { flex: 1; font-weight: 600; }
    .opt .ic { width: 16px; height: 16px; color: #94a0b3; }
    .opt[aria-selected="true"] { border-color: var(--gold); background: #fff8e8; }

    /* Notification */
    .toast {
      position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; z-index: 30; width: calc(100% - 32px); max-width: 390px;
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
      background: #eaf7ef; border: 1px solid #9bd5b0; color: #14532d; font-size: 15px; font-weight: 650;
      box-shadow: 0 12px 30px #0006; transform: translate(-50%, -160%); opacity: 0;
      transition: transform .35s ease, opacity .35s ease; pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { background: #fdecee; border-color: #efa2ab; color: #7f1d2b; }
    .toast .badge { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #1f9d55; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
    .toast.error .badge { background: #d1434f; }

    @media (min-width: 900px) {
      .shell { flex-direction: row; }
      .hero { flex: 1 1 50%; min-height: 100vh; padding: 48px; position: relative; background: var(--navy); }
      .copy { display: block; position: absolute; left: 48px; right: 48px; bottom: 40px; text-align: left; font-size: 13px; color: #7f8aa3; }
      .sheet { flex: 1 1 50%; margin-top: 0; border-radius: 0; display: flex; align-items: center; padding: 48px; }
      .inner { width: 100%; }
      .picker .pane { bottom: 50%; transform: translateY(50%) scale(.96); opacity: 0; border-radius: 22px; padding-top: 22px; transition: transform .25s ease, opacity .25s ease; }
      .picker.open .pane { transform: translateY(50%); opacity: 1; }
      .grab { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .toast, .pane, .backdrop { transition: none; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 18.5h3"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-4-5-4-5-2s3 2 5 2zm0 0c1.5-4 5-4 5-2s-3 2-5 2z"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eyeoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    </defs>
  </svg>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="badge" id="toastBadge">✓</span><span id="toastText"></span>
  </div>

  <div class="shell">
    <section class="hero" aria-label="JBL">
      <div>
        <div class="logo">JBL</div>
        <span class="bar"></span>
      </div>
      <div class="copy">© 2026 JBL. Tous droits réservés.</div>
    </section>

    <main class="sheet">
      <div class="inner">
        <h1>Créer un compte</h1>
        <p class="sub">Renseignez vos informations pour commencer.</p>

        <form id="signupForm" novalidate>
          <div class="field">
            <label for="phone">Numéro de téléphone</label>
            <div class="ctl">
              <button type="button" class="dial" id="dialBtn" aria-haspopup="dialog" aria-label="Choisir le pays">
                <svg class="ic"><use href="#i-phone"/></svg><span id="dialText">+226</span><svg class="ic chev"><use href="#i-down"/></svg>
              </button>
              <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Votre numéro" maxlength="15" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="ctl">
              <svg class="ic"><use href="#i-lock"/></svg>
              <input id="password" type="password" autocomplete="new-password" placeholder="8 caractères minimum" required>
              <button type="button" class="eye" data-target="password" aria-label="Afficher le mot de passe"><svg class="ic"><use href="#i-eye"/></svg></button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirmer le mot de passe</label>
            <div class="ctl">
              <svg class="ic"><use href="#i-lock"/></svg>
              <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Saisissez-le à nouveau" required>
              <button type="button" class="eye" data-target="confirmPassword" aria-label="Afficher la confirmation"><svg class="ic"><use href="#i-eye"/></svg></button>
            </div>
          </div>

          <div class="field">
            <label for="transactionPassword">Mot de passe de transaction</label>
            <div class="ctl">
              <svg class="ic"><use href="#i-key"/></svg>
              <input id="transactionPassword" type="password" inputmode="numeric" autocomplete="new-password" placeholder="4 caractères minimum" required>
              <button type="button" class="eye" data-target="transactionPassword" aria-label="Afficher le mot de passe de transaction"><svg class="ic"><use href="#i-eye"/></svg></button>
            </div>
          </div>

          <div class="field">
            <label for="referral">Code de parrainage <small>(facultatif)</small></label>
            <div class="ctl">
              <svg class="ic"><use href="#i-gift"/></svg>
              <input id="referral" type="text" autocomplete="off" autocapitalize="none" maxlength="6" placeholder="6 caractères">
            </div>
            <p class="note" id="refNote" hidden><svg class="ic"><use href="#i-check"/></svg>Code d'invitation appliqué</p>
          </div>

          <button class="submit" id="submitBtn" type="submit">Créer mon compte</button>
          <p class="foot">Vous avez déjà un compte ? <a href="/connexion">Se connecter</a></p>
        </form>
      </div>
    </main>
  </div>

  <div class="picker" id="picker" aria-hidden="true">
    <div class="backdrop" data-close></div>
    <div class="pane" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="grab"></div>
      <div class="pane-head">
        <button type="button" class="back" data-close aria-label="Fermer"><svg class="ic"><use href="#i-left"/></svg></button>
        <h2 id="pickerTitle">Sélectionnez votre pays</h2>
      </div>
      <div class="list" id="countryList" role="listbox" aria-labelledby="pickerTitle"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://edhfmgyqqrbgstmjvmlf.supabase.co/functions/v1/user-auth";
    // Pour ajouter un pays (ex. Cameroun +237, Sénégal +221, Côte d'Ivoire +225),
    // ajoutez-le ici ET autorisez-le côté serveur, sinon l'API renverra COUNTRY_NOT_ALLOWED.
    const COUNTRIES = [
      { code: "BF", dial: "+226", name: "Burkina Faso" },
      { code: "BJ", dial: "+229", name: "Bénin" },
      { code: "TG", dial: "+228", name: "Togo" }
    ];

    const $ = (id) => document.getElementById(id);
    const form = $("signupForm"), submitBtn = $("submitBtn"), referralInput = $("referral");
    const toast = $("toast"), toastText = $("toastText"), toastBadge = $("toastBadge");
    const picker = $("picker"), dialBtn = $("dialBtn"), list = $("countryList");
    let selected = COUNTRIES[0], toastTimer;

    /* ----- Code de parrainage automatique (lien d'invitation) ----- */
    function cleanCode(v) { return String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 6); }
    function readReferral() {
      const params = new URLSearchParams(window.location.search);
      for (const k of ["ref", "referral", "referral_code", "code", "invite", "invitation", "parrain", "parrainage"]) {
        const c = cleanCode(params.get(k));
        if (c) return c;
      }
      // Lien du type /register/abc123 ou /invite/abc123
      const m = window.location.pathname.match(/^\/(?:register|invite)\/([^\/]+)\/?$/i);
      if (m) { const c = cleanCode(decodeURIComponent(m[1])); if (c) return c; }
      return "";
    }
    (function applyReferral() {
      let code = readReferral();
      try {
        if (code) localStorage.setItem("jbl_referral", code);
        else code = cleanCode(localStorage.getItem("jbl_referral"));
      } catch (e) {}
      if (code) { referralInput.value = code; $("refNote").hidden = false; }
    })();

    /* ----- Sélecteur de pays ----- */
    function renderCountries() {
      list.innerHTML = "";
      COUNTRIES.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.setAttribute("role", "option");
        b.setAttribute("aria-selected", String(c.code === selected.code));
        b.innerHTML = '<span class="d"></span><span class="n"></span><svg class="ic"><use href="#i-right"/></svg>';
        b.querySelector(".d").textContent = c.dial;
        b.querySelector(".n").textContent = c.name;
        b.addEventListener("click", () => { selected = c; $("dialText").textContent = c.dial; closePicker(); $("phone").focus(); });
        list.appendChild(b);
      });
    }
    function openPicker() {
      renderCountries();
      picker.classList.add("open"); picker.setAttribute("aria-hidden", "false");
      setTimeout(() => (list.querySelector('[aria-selected="true"]') || list.firstChild).focus(), 50);
    }
    function closePicker() { picker.classList.remove("open"); picker.setAttribute("aria-hidden", "true"); }
    dialBtn.addEventListener("click", openPicker);
    picker.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => { closePicker(); dialBtn.focus(); }));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && picker.classList.contains("open")) { closePicker(); dialBtn.focus(); } });

    /* ----- Afficher / masquer les mots de passe ----- */
    document.querySelectorAll(".eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = $(btn.dataset.target), show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.querySelector("use").setAttribute("href", show ? "#i-eyeoff" : "#i-eye");
      });
    });

    /* ----- Notification ----- */
    function notify(text, type) {
      clearTimeout(toastTimer);
      toast.className = "toast" + (type === "error" ? " error" : "");
      toastBadge.textContent = type === "error" ? "!" : "✓";
      toastText.textContent = text;
      void toast.offsetWidth;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), type === "error" ? 4500 : 3000);
    }

    /* ----- Inscription ----- */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const country_code = selected.code;
      const phone_number = $("phone").value.replace(/\D/g, "");
      const login_password = $("password").value;
      const confirm_password = $("confirmPassword").value;
      const transaction_password = $("transactionPassword").value;
      const referral_code = referralInput.value.trim().toLowerCase();
      const bytes = (s) => new TextEncoder().encode(s).length;

      if (phone_number.length < 7 || phone_number.length > 15) return notify("Saisissez un numéro de téléphone valide.", "error");
      if (bytes(login_password) < 8) return notify("Le mot de passe doit contenir au moins 8 caractères.", "error");
      if (login_password !== confirm_password) return notify("Les deux mots de passe ne correspondent pas.", "error");
      if (bytes(transaction_password) < 4) return notify("Le mot de passe de transaction doit contenir au moins 4 caractères.", "error");
      if (referral_code && !/^[a-z0-9]{6}$/.test(referral_code)) return notify("Le code de parrainage doit contenir exactement 6 lettres minuscules ou chiffres.", "error");

      submitBtn.disabled = true;
      submitBtn.textContent = "Création du compte…";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "signup", country_code, phone_number, login_password, transaction_password,
            referral_code: referral_code || null
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) {
          const errors = {
            COUNTRY_NOT_ALLOWED: "Ce pays n'est pas autorisé.",
            INVALID_PHONE_NUMBER: "Le numéro de téléphone n'est pas valide.",
            LOGIN_PASSWORD_LENGTH_INVALID: "Le mot de passe doit contenir entre 8 et 72 octets.",
            TRANSACTION_PASSWORD_LENGTH_INVALID: "Le mot de passe de transaction doit contenir entre 4 et 72 octets.",
            INVALID_REFERRAL_CODE: "Le code de parrainage est invalide.",
            PHONE_ALREADY_REGISTERED: "Ce numéro est déjà inscrit. Connectez-vous à votre compte.",
            SERVER_CONFIGURATION_ERROR: "Le serveur n'est pas encore correctement configuré."
          };
          throw new Error(errors[result.error] || "Impossible de créer le compte. Réessayez.");
        }

        // Clés de session inchangées : elles correspondent à la base existante
        if (result.session && result.session.token) localStorage.setItem("ethan_session_token", result.session.token);
        if (result.user) localStorage.setItem("ethan_user", JSON.stringify(result.user));
        try { localStorage.removeItem("jbl_referral"); } catch (e) {}

        notify("Inscription réussie", "success");
        form.reset();
        setTimeout(() => { window.location.href = "/accueil"; }, 1800);
      } catch (error) {
        notify(error.message || "Erreur de connexion. Vérifiez votre réseau.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Créer mon compte";
      }
    });
  </script>
</body>
</html>
