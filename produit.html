<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#67c277">
<title>JBL | Produits</title>
<style>
:root{--green:#67c277;--green-d:#4bb531;--line:#a4d9ac;--field:#f3f3f3;--ink:#1d2433;--dial:#2c3552;--ph:#8b909a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:#fff linear-gradient(180deg,#67c277 0,#67c277 270px,#86d995 345px,#b5ebc0 420px,#e0f5e5 495px,#fff 570px) no-repeat;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.page{width:min(100%,520px);margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}

/* En-tête */
.logo{margin:0 2px 14px;color:#fff;font-family:"Arial Black","Archivo Black",Impact,"Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:44px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.hero-title{margin:0 2px 16px;color:#fff}
.hero-title h1{font-size:24px;line-height:1.15;margin:0 0 6px;font-weight:800}
.hero-title p{font-size:12px;letter-spacing:.14em;margin:0;opacity:.92;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-link{display:flex;flex-direction:column;gap:4px;min-width:0;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 8px 20px #2f7a3c26;transition:filter .15s}
.stat-link:hover{filter:brightness(.97)}
.stat-link:focus-visible{outline:3px solid #ffffffb0;outline-offset:3px}
.stat-number{font-size:clamp(17px,5vw,21px);font-weight:800;color:var(--green-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-label{font-size:14px;font-weight:700;color:var(--dial);line-height:1.3}
.stat-label span{display:block;font-size:12px;font-weight:600;color:var(--ph);margin-top:2px}

/* Catégories */
.content{margin-top:18px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.category{height:48px;border:1.5px solid var(--green);border-radius:999px;background:#fff;color:var(--green-d);font:inherit;font-size:18px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.category.active{background:var(--green);color:#fff}
.category:focus-visible,.buy:focus-visible,.modal button:focus-visible,.nav a:focus-visible{outline:3px solid #4bb53155;outline-offset:3px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.section-head h2{font-size:19px;font-weight:700;margin:0;color:#1b1b1b}
.section-head small{font-size:14px;font-weight:600;color:var(--ph)}

/* Produits */
.product{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 10px 26px #2f7a3c1f}
.product-info{min-width:0}
.product-name{font-size:18px;line-height:1.25;color:var(--ink);font-weight:800;margin:2px 0 10px;overflow-wrap:anywhere}
.detail{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:8px 0;color:var(--ph);font-weight:600}
.detail span:last-child{color:var(--ink);text-align:right;font-weight:700;white-space:nowrap}
.detail:last-child span:last-child{color:var(--green-d)}
.product-media{display:flex;flex-direction:column;gap:10px}
.product-media img{width:100%;height:116px;object-fit:cover;border:1.5px solid var(--line);border-radius:9px;background:var(--field)}
.buy{width:100%;height:44px;border:0;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:filter .15s,transform .1s}
.buy:hover{filter:brightness(.96)}
.buy:active{transform:scale(.98)}
.buy:disabled{background:var(--field);color:var(--ph);border:1.5px solid var(--line);cursor:not-allowed;filter:none;transform:none;font-size:13px}
.empty,.loading{background:var(--field);border:1.5px solid var(--line);border-radius:9px;padding:26px 16px;text-align:center;color:var(--dial);font-size:15px;line-height:1.55}
.loading{color:var(--ph);font-weight:600}

/* Navigation */
.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid var(--line);display:flex;justify-content:center}
.nav{width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ph);font-size:12px;font-weight:600;padding:4px;border-radius:9px}
.nav a.active{color:var(--green-d)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Notification */
.toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);width:min(calc(100% - 32px),440px);padding:14px 16px;border-radius:9px;background:#fff;border:1.5px solid var(--green);color:#14532d;box-shadow:0 12px 30px #0003;opacity:0;pointer-events:none;transition:.25s;font-size:15px;font-weight:600;line-height:1.45}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{border-color:#e0707a;color:#7f1d2b}

/* Fenêtre de confirmation (même gabarit que le sélecteur de pays) */
.overlay{display:none;position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{width:100%;max-width:520px;background:#fff;border-radius:30px 30px 0 0;text-align:center;padding:12px 20px calc(26px + env(safe-area-inset-bottom));animation:rise .3s ease}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.grab{width:46px;height:5px;border-radius:3px;background:#d3d3d3;margin:0 auto 20px}
.modal h3{font-size:20px;font-weight:700;margin:0 0 10px;color:#1b1b1b}
.modal p{font-size:16px;color:var(--dial);line-height:1.5;margin:0 0 20px}
.modal-actions{display:grid;gap:6px}
.modal .confirm{height:52px;border:0;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.modal .confirm:disabled{opacity:.7;cursor:wait}
.modal .cancel{border:0;background:transparent;color:#5db96b;font:inherit;font-size:17px;font-weight:500;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;margin-top:12px;padding:4px;cursor:pointer}
@media(min-width:500px){.product{grid-template-columns:minmax(0,1fr) 135px}.product-media img{height:125px}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}.toast{transition:none}}
</style></head>
<body>
<div class="page">
<header>
  <div class="logo">JBL</div>
  <div class="hero-title"><h1>Nos opportunités</h1><p>INVESTISSEZ · SUIVEZ · PROGRESSEZ</p></div>
  <div class="stats">
    <a class="stat-link" href="mes-produits.html"><span class="stat-number" id="ownedCount">—</span><span class="stat-label">Mes produits <span>Voir mes achats ›</span></span></a>
    <a class="stat-link" href="mes-revenus.html"><span class="stat-number" id="incomeTotal">FCFA —</span><span class="stat-label">Mes revenus <span>Consulter ›</span></span></a>
  </div>
</header>
<main class="content">
  <div class="categories">
    <button class="category active" data-category="simple" type="button">Standard</button>
    <button class="category" data-category="premium" type="button">Premium</button>
  </div>
  <div class="section-head"><h2 id="categoryTitle">Produits Standard</h2><small id="productCount">Chargement…</small></div>
  <div id="products"><div class="loading">Chargement des opportunités…</div></div>
</main>
</div>
<nav class="bottom" aria-label="Navigation principale"><div class="nav">
<a href="accueil.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-7h6v7"/></svg>Accueil</a>
<a class="active" href="produit.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></svg>Produit</a>
<a href="equipe.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1"/></svg>Équipe</a>
<a href="profil.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</a>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal"><div class="grab"></div><h3 id="confirmTitle">Confirmer votre investissement</h3><p id="confirmText">Souhaitez-vous investir dans ce produit ?</p><div class="modal-actions"><button class="confirm" type="button" id="confirmBuy">Confirmer</button><button class="cancel" type="button" id="cancelBuy">Annuler</button></div></div>
</div>
<script>
const CATALOG_API="https://edhfmgyqqrbgstmjvmlf.supabase.co/functions/v1/product-catalog";
const PURCHASE_API="https://edhfmgyqqrbgstmjvmlf.supabase.co/functions/v1/purchase-api";
const SESSION_KEY="ethan_session_token";
let allProducts=[],currentCategory="simple",selectedProduct=null,buying=false;
const list=document.getElementById("products"),toast=document.getElementById("toast"),overlay=document.getElementById("confirmOverlay");
const money=n=>new Intl.NumberFormat("fr-FR").format(Number(n||0))+" FCFA";
function notify(message,error=false){toast.textContent=message;toast.className="toast show"+(error?" error":"");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.className="toast",4200)}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function productImage(product,index){
  const prefix=product.product_type==="premium"?"pp":"p";
  return prefix+(index+1)+".png";
}
function render(){
  const filtered=allProducts.filter(p=>p.product_type===currentCategory);
  document.getElementById("categoryTitle").textContent=currentCategory==="simple"?"Produits Standard":"Produits Premium";
  document.getElementById("productCount").textContent=filtered.length+" produit"+(filtered.length>1?"s":"");
  document.querySelectorAll(".category").forEach(b=>b.classList.toggle("active",b.dataset.category===currentCategory));
  if(!filtered.length){list.innerHTML='<div class="empty">Aucun produit disponible dans cette catégorie pour le moment.<br>Revenez prochainement découvrir nos nouvelles offres.</div>';return}
  list.innerHTML=filtered.map((p,i)=>{
    const active=p.is_active===true;
    return `<article class="product">
      <div class="product-info">
        <h3 class="product-name">${escapeHTML(p.name)}</h3>
        <div class="detail"><span>Prix :</span><span>${money(p.price_xof)}</span></div>
        <div class="detail"><span>Durée :</span><span>${escapeHTML(p.cycle_days)} jours</span></div>
        <div class="detail"><span>Revenu quotidien :</span><span>${money(p.daily_income_xof)}</span></div>
        <div class="detail"><span>Revenu total :</span><span>${money(p.total_income_xof)}</span></div>
      </div>
      <div class="product-media">
        <img src="${productImage(p,i)}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.style.opacity='.25';this.alt='Image du produit à ajouter'">
        <button class="buy" type="button" data-buy="${escapeHTML(p.id)}" ${active?"":"disabled"}>${active?"Investir":"Bientôt disponible"}</button>
      </div>
    </article>`;
  }).join("");
}
async function loadCatalog(){
  const token=localStorage.getItem(SESSION_KEY);
  if(!token){location.href="connexion-ethan.html";return}
  try{
    const res=await fetch(CATALOG_API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action:"list"})});
    const data=await res.json().catch(()=>({}));
    if(res.status===401){localStorage.removeItem(SESSION_KEY);location.href="connexion-ethan.html";return}
    if(!res.ok||!data.ok)throw new Error("Impossible de charger les produits.");
    allProducts=Array.isArray(data.products)?data.products:[];
    document.getElementById("ownedCount").textContent=Number(data.stats?.purchased_products_count||0);
    document.getElementById("incomeTotal").textContent=money(data.stats?.total_income_xof||0);
    render();
  }catch(e){list.innerHTML='<div class="empty">Nous ne parvenons pas à charger les produits pour le moment.<br>Veuillez actualiser la page dans quelques instants.</div>';notify(e.message||"Erreur de chargement.",true)}
}
document.querySelectorAll(".category").forEach(b=>b.addEventListener("click",()=>{currentCategory=b.dataset.category;render()}));
list.addEventListener("click",e=>{
 const btn=e.target.closest("[data-buy]");if(!btn||btn.disabled)return;
 selectedProduct=allProducts.find(p=>p.id===btn.dataset.buy);
 if(!selectedProduct||!selectedProduct.is_active)return;
 document.getElementById("confirmText").textContent=`Vous êtes sur le point d'investir ${money(selectedProduct.price_xof)} dans « ${selectedProduct.name} ». Confirmez-vous cette opération ?`;
 overlay.classList.add("show");
});
document.getElementById("cancelBuy").addEventListener("click",()=>{overlay.classList.remove("show");selectedProduct=null});
document.getElementById("confirmBuy").addEventListener("click",async()=>{
 if(!selectedProduct||buying)return;
 const token=localStorage.getItem(SESSION_KEY);if(!token){location.href="connexion-ethan.html";return}
 buying=true;const button=document.getElementById("confirmBuy");button.disabled=true;button.textContent="Traitement…";
 try{
   const res=await fetch(PURCHASE_API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action:"buy",product_id:selectedProduct.id,idempotency_key:crypto.randomUUID()})});
   const data=await res.json().catch(()=>({}));
   if(res.status===401){localStorage.removeItem(SESSION_KEY);location.href="connexion-ethan.html";return}
   if(!res.ok||!data.ok){
     const messages={INSUFFICIENT_BALANCE:"Votre solde est insuffisant. Rechargez votre compte pour continuer.",PRODUCT_NOT_AVAILABLE:"Ce produit n'est plus disponible. Actualisez la page.",PRODUCT_DAILY_LIMIT_REACHED:"Vous avez atteint la limite d'achat autorisée pour ce produit.",ACCOUNT_UNAVAILABLE:"Votre compte ne peut pas effectuer cette opération."};
     throw new Error(messages[data.error]||"Votre investissement n'a pas pu être effectué. Veuillez réessayer.");
   }
   overlay.classList.remove("show");notify("Investissement confirmé ! Votre produit a été ajouté à vos achats.");
   selectedProduct=null;await loadCatalog();
 }catch(err){overlay.classList.remove("show");notify(err.message||"Une erreur est survenue.",true)}
 finally{buying=false;button.disabled=false;button.textContent="Confirmer"}
});
overlay.addEventListener("click",e=>{if(e.target===overlay){overlay.classList.remove("show");selectedProduct=null}});
loadCatalog();
</script></body></html>
