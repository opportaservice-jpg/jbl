<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#67c277">
  <title>JBL | Inscription</title>
  <style>
    :root { --green: #67c277; --green-d: #4bb531; --line: #a4d9ac; --field: #f3f3f3; --ink: #1d2433; --dial: #2c3552; --ph: #8b909a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: #fff; color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(180deg, #67c277 0%, #67c277 36%, #86d995 47%, #b5ebc0 57%, #e0f5e5 69%, #ffffff 81%);
    }
    .ic { width: 24px; height: 24px; flex: none; }

    /* Grande zone avec le nom JBL */
    .hero { height: 42vh; height: 42dvh; min-height: 250px; width: 100%; display: flex; align-items: center; justify-content: center; padding-top: 4dvh; }
    .logo {
      margin: 0; color: #fff; font-family: "Arial Black", "Archivo Black", Impact, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900; font-size: min(33vw, 150px); letter-spacing: .02em; line-height: 1; text-transform: uppercase;
    }

    form { width: 88%; max-width: 440px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .ctl {
      display: flex; align-items: center; height: 52px; margin: 0 0 14px; border: 1.5px solid var(--line);
      border-radius: 9px; background: var(--field); transition: border-color .15s, box-shadow .15s;
    }
    .ctl:focus-within { border-color: var(--green-d); box-shadow: 0 0 0 3px #4bb53126; }
    .ctl > .ic { margin-left: 14px; color: var(--green-d); }
    .ctl input {
      flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
      padding: 0 12px; font: inherit; font-size: 16px; color: var(--ink); text-overflow: ellipsis;
    }
    .ctl input::placeholder { color: var(--ph); }
    .dial { height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 0 0 14px; border: 0; background: transparent; font: inherit; cursor: pointer; border-radius: 9px 0 0 9px; }
    .dial .ic { margin: 0; color: var(--green-d); }
    .dial b { font-size: 18px; font-weight: 600; color: var(--dial); }
    .dial .chev { width: 14px; height: 14px; color: #8b909a; margin: 0 4px 0 -4px; }
    .dial:focus-visible { outline: 2px solid var(--green-d); outline-offset: -3px; }
    .eye { width: 44px; height: 100%; border: 0; background: transparent; color: #9aa0aa; cursor: pointer; display: grid; place-items: center; border-radius: 0 9px 9px 0; flex: none; }
    .eye .ic { width: 20px; height: 20px; margin: 0; color: inherit; }
    .eye:focus-visible { outline: 2px solid var(--green-d); outline-offset: -3px; }
    .submit {
      display: block; width: 100%; height: 52px; margin-top: 4px; border: 0; border-radius: 999px; background: var(--green);
      color: #fff; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; transition: filter .15s, transform .1s;
    }
    .submit:hover { filter: brightness(.96); }
    .submit:active { transform: scale(.99); }
    .submit:focus-visible { outline: 3px solid #4bb53155; outline-offset: 3px; }
    .submit:disabled { opacity: .7; cursor: wait; }
    .go { display: block; width: fit-content; margin: 26px auto 0; color: #5db96b; font-size: 17px; font-weight: 500; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

    /* Sélection du pays */
    .picker { position: fixed; inset: 0; z-index: 20; visibility: hidden; transition: visibility 0s .3s; }
    .picker.open { visibility: visible; transition-delay: 0s; }
    .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .3s; }
    .picker.open .backdrop { opacity: 1; }
    .pane {
      position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: #fff;
      border-radius: 30px 30px 0 0; padding: 12px 16px calc(26px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform .3s ease;
    }
    .picker.open .pane { transform: none; }
    .grab { width: 46px; height: 5px; border-radius: 3px; background: #d3d3d3; margin: 0 auto 16px; }
    .pane-head { display: flex; align-items: center; margin-bottom: 18px; }
    .back { width: 42px; height: 42px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: #1b1b1b; }
    .back .ic { width: 22px; height: 22px; }
    .pane-head h2 { flex: 1; margin: 0 42px 0 0; text-align: center; font-size: 19px; font-weight: 650; color: #1b1b1b; }
    .list { display: grid; gap: 12px; }
    .opt {
      display: flex; align-items: center; width: 100%; height: 54px; padding: 0 18px; border: 1px solid #e8e8e8;
      border-radius: 14px; background: #f4f4f4; font: inherit; font-size: 18px; cursor: pointer; text-align: left; color: #1b1b1b;
    }
    .opt:focus-visible { outline: 2px solid var(--green-d); outline-offset: 1px; }
    .opt .d { width: 74px; font-weight: 700; color: var(--green-d); }
    .opt .n { flex: 1; font-weight: 500; }
    .opt .ic { width: 16px; height: 16px; color: #9a9a9a; }
    .opt[aria-selected="true"] { border-color: var(--green-d); background: #eef9ef; }

    /* Notification */
    .toast {
      position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; z-index: 30; width: calc(100% - 32px); max-width: 390px;
      display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
      background: #fff; border: 1.5px solid var(--green); color: #14532d; font-size: 16px; font-weight: 650;
      box-shadow: 0 12px 30px #0003; transform: translate(-50%, -160%); opacity: 0;
      transition: transform .35s ease, opacity .35s ease; pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.error { border-color: #e0707a; color: #7f1d2b; }
    .toast .badge { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--green-d); color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 800; }
    .toast.error .badge { background: #d1434f; }

    @media (min-width: 700px) { .hero { height: 38vh; } .logo { font-size: 130px; } }
    @media (prefers-reduced-motion: reduce) { .toast, .pane, .backdrop { transition: none; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2" width="13" height="20" rx="3.2"/><path d="M10.2 18.2h3.6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7.5 10.5V7a4.5 4.5 0 018.2-2.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="4" y="10" width="16" height="12" rx="3" fill="currentColor"/><circle cx="12" cy="15.2" r="1.5" fill="#fff"/><path d="M12 15.5v2.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6L2.8 12l5.7 6M15.5 6l5.7 6-5.7 6"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-eyeoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
    </defs>
  </svg>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="badge" id="toastBadge">✓</span><span id="toastText"></span>
  </div>

  <div class="page">
    <header class="hero"><h1 class="logo">JBL</h1></header>

    <form id="signupForm" novalidate>
      <div class="ctl">
        <button type="button" class="dial" id="dialBtn" aria-haspopup="dialog" aria-label="Choisir le pays">
          <svg class="ic"><use href="#i-phone"/></svg><b id="dialText">+226</b><svg class="ic chev"><use href="#i-down"/></svg>
        </button>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Entrez le numéro de téléphone" maxlength="15" aria-label="Numéro de téléphone" required>
      </div>

      <div class="ctl">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input id="password" type="password" autocomplete="new-password" placeholder="Entrez le mot de passe" aria-label="Mot de passe" required>
        <button type="button" class="eye" data-target="password" aria-label="Afficher le mot de passe"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>

      <div class="ctl">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Saisissez de nouveau le mot de passe" aria-label="Confirmer le mot de passe" required>
        <button type="button" class="eye" data-target="confirmPassword" aria-label="Afficher la confirmation"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>

      <div class="ctl">
        <svg class="ic"><use href="#i-lock"/></svg>
        <input id="transactionPassword" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Mot de passe de transaction" aria-label="Mot de passe de transaction" required>
        <button type="button" class="eye" data-target="transactionPassword" aria-label="Afficher le mot de passe de transaction"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>

      <div class="ctl">
        <svg class="ic"><use href="#i-code"/></svg>
        <input id="referral" type="text" autocomplete="off" autocapitalize="none" maxlength="6" placeholder="Code de parrainage (facultatif)" aria-label="Code de parrainage">
      </div>

      <button class="submit" id="submitBtn" type="submit">S'inscrire</button>
      <a class="go" href="/connexion">Aller à la connexion &gt;</a>
    </form>
  </div>

  <div class="picker" id="picker" aria-hidden="true">
    <div class="backdrop" data-close></div>
    <div class="pane" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="grab"></div>
      <div class="pane-head">
        <button type="button" class="back" data-close aria-label="Fermer"><svg class="ic"><use href="#i-left"/></svg></button>
        <h2 id="pickerTitle">Sélectionnez votre pays</h2>
      </div>
      <div class="list" id="countryList" role="listbox" aria-labelledby="pickerTitle"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://edhfmgyqqrbgstmjvmlf.supabase.co/functions/v1/user-auth";
    // Pour ajouter un pays (ex. Cameroun +237, Sénégal +221, Côte d'Ivoire +225),
    // ajoutez-le ici ET autorisez-le côté serveur, sinon l'API renverra COUNTRY_NOT_ALLOWED.
    const COUNTRIES = [
      { code: "BF", dial: "+226", name: "Burkina Faso" },
      { code: "BJ", dial: "+229", name: "Bénin" },
      { code: "TG", dial: "+228", name: "Togo" }
    ];

    const $ = (id) => document.getElementById(id);
    const form = $("signupForm"), submitBtn = $("submitBtn"), referralInput = $("referral");
    const toast = $("toast"), toastText = $("toastText"), toastBadge = $("toastBadge");
    const picker = $("picker"), dialBtn = $("dialBtn"), list = $("countryList");
    let selected = COUNTRIES[0], toastTimer;

    /* ----- Code de parrainage automatique (lien d'invitation) ----- */
    function cleanCode(v) { return String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 6); }
    function readReferral() {
      const params = new URLSearchParams(window.location.search);
      for (const k of ["ref", "referral", "referral_code", "code", "invite", "invitation", "parrain", "parrainage"]) {
        const c = cleanCode(params.get(k));
        if (c) return c;
      }
      const m = window.location.pathname.match(/^\/(?:register|invite)\/([^\/]+)\/?$/i);
      if (m) { const c = cleanCode(decodeURIComponent(m[1])); if (c) return c; }
      return "";
    }
    (function applyReferral() {
      let code = readReferral();
      try {
        if (code) localStorage.setItem("jbl_referral", code);
        else code = cleanCode(localStorage.getItem("jbl_referral"));
      } catch (e) {}
      if (code) referralInput.value = code;
    })();

    /* ----- Sélecteur de pays ----- */
    function renderCountries() {
      list.innerHTML = "";
      COUNTRIES.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "opt"; b.setAttribute("role", "option");
        b.setAttribute("aria-selected", String(c.code === selected.code));
        b.innerHTML = '<span class="d"></span><span class="n"></span><svg class="ic"><use href="#i-right"/></svg>';
        b.querySelector(".d").textContent = c.dial;
        b.querySelector(".n").textContent = c.name;
        b.addEventListener("click", () => { selected = c; $("dialText").textContent = c.dial; closePicker(); $("phone").focus(); });
        list.appendChild(b);
      });
    }
    function openPicker() {
      renderCountries();
      picker.classList.add("open"); picker.setAttribute("aria-hidden", "false");
      setTimeout(() => (list.querySelector('[aria-selected="true"]') || list.firstChild).focus(), 50);
    }
    function closePicker() { picker.classList.remove("open"); picker.setAttribute("aria-hidden", "true"); }
    dialBtn.addEventListener("click", openPicker);
    picker.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", () => { closePicker(); dialBtn.focus(); }));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && picker.classList.contains("open")) { closePicker(); dialBtn.focus(); } });

    /* ----- Afficher / masquer les mots de passe ----- */
    document.querySelectorAll(".eye").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = $(btn.dataset.target), show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.querySelector("use").setAttribute("href", show ? "#i-eyeoff" : "#i-eye");
      });
    });

    /* ----- Notification ----- */
    function notify(text, type) {
      clearTimeout(toastTimer);
      toast.className = "toast" + (type === "error" ? " error" : "");
      toastBadge.textContent = type === "error" ? "!" : "✓";
      toastText.textContent = text;
      void toast.offsetWidth;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), type === "error" ? 4500 : 3000);
    }

    /* ----- Inscription ----- */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const country_code = selected.code;
      const phone_number = $("phone").value.replace(/\D/g, "");
      const login_password = $("password").value;
      const confirm_password = $("confirmPassword").value;
      const transaction_password = $("transactionPassword").value;
      const referral_code = referralInput.value.trim().toLowerCase();
      const bytes = (s) => new TextEncoder().encode(s).length;

      if (phone_number.length < 7 || phone_number.length > 15) return notify("Saisissez un numéro de téléphone valide.", "error");
      if (bytes(login_password) < 8) return notify("Le mot de passe doit contenir au moins 8 caractères.", "error");
      if (login_password !== confirm_password) return notify("Les deux mots de passe ne correspondent pas.", "error");
      if (bytes(transaction_password) < 4) return notify("Le mot de passe de transaction doit contenir au moins 4 caractères.", "error");
      if (referral_code && !/^[a-z0-9]{6}$/.test(referral_code)) return notify("Le code de parrainage doit contenir exactement 6 lettres minuscules ou chiffres.", "error");

      submitBtn.disabled = true;
      submitBtn.textContent = "Création du compte…";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "signup", country_code, phone_number, login_password, transaction_password,
            referral_code: referral_code || null
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) {
          const errors = {
            COUNTRY_NOT_ALLOWED: "Ce pays n'est pas autorisé.",
            INVALID_PHONE_NUMBER: "Le numéro de téléphone n'est pas valide.",
            LOGIN_PASSWORD_LENGTH_INVALID: "Le mot de passe doit contenir entre 8 et 72 octets.",
            TRANSACTION_PASSWORD_LENGTH_INVALID: "Le mot de passe de transaction doit contenir entre 4 et 72 octets.",
            INVALID_REFERRAL_CODE: "Le code de parrainage est invalide.",
            PHONE_ALREADY_REGISTERED: "Ce numéro est déjà inscrit. Connectez-vous à votre compte.",
            SERVER_CONFIGURATION_ERROR: "Le serveur n'est pas encore correctement configuré."
          };
          throw new Error(errors[result.error] || "Impossible de créer le compte. Réessayez.");
        }

        // Clés de session inchangées : elles correspondent à la base existante
        if (result.session && result.session.token) localStorage.setItem("ethan_session_token", result.session.token);
        if (result.user) localStorage.setItem("ethan_user", JSON.stringify(result.user));
        try { localStorage.removeItem("jbl_referral"); } catch (e) {}

        notify("Inscription réussie", "success");
        form.reset();
        setTimeout(() => { window.location.href = "/accueil"; }, 1800);
      } catch (error) {
        notify(error.message || "Erreur de connexion. Vérifiez votre réseau.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "S'inscrire";
      }
    });
  </script>
</body>
</html>
